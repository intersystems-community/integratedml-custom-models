# IntegratedML Flexible Model Integration Demo - Configuration Template
# This file shows example configurations for all three demo models

# Demo 1: Credit Risk Assessment Configuration
credit_risk:
  model_class: "CustomCreditRiskClassifier"
  parameters:
    enable_debt_ratio: true
    enable_interaction_terms: true
    enable_risk_scoring: true
    decision_threshold: 0.6
  
  # Feature engineering options
  feature_engineering:
    debt_ratio_features:
      - "total_debt_to_income"
      - "credit_utilization_ratio"
      - "payment_to_income_ratio"
    
    interaction_terms:
      - ["age", "credit_amount"]
      - ["duration", "purpose"]
      - ["employment_duration", "credit_history"]
    
    risk_scoring_components:
      - "stability_score"
      - "credit_behavior_score"
      - "financial_capacity_score"
  
  # Training configuration
  training:
    validation_split: 0.2
    random_state: 42
    class_weight: "balanced"

# Demo 2: Fraud Detection Ensemble Configuration
fraud_detection:
  model_class: "EnsembleFraudDetector"
  parameters:
    voting: "weighted"
    confidence_threshold: 0.8
    enable_rule_engine: true
    enable_anomaly_detection: true
    enable_ml_classifier: true
    real_time_updates: false
  
  # Component model configurations
  components:
    anomaly_detector:
      type: "IsolationForest"
      parameters:
        contamination: 0.1
        n_estimators: 100
        max_samples: "auto"
        random_state: 42
    
    ml_classifier:
      type: "XGBoost"
      parameters:
        n_estimators: 100
        max_depth: 6
        learning_rate: 0.1
        subsample: 0.8
        colsample_bytree: 0.8
        random_state: 42
    
    rule_engine:
      rules:
        - name: "high_amount_threshold"
          condition: "amount > 10000"
          risk_score: 0.8
        - name: "unusual_time_pattern"
          condition: "hour_of_day < 6 OR hour_of_day > 23"
          risk_score: 0.6
        - name: "high_velocity_transactions"
          condition: "transaction_velocity > 5"
          risk_score: 0.7
  
  # Ensemble weighting strategy
  ensemble:
    strategy: "confidence_weighted"
    weights:
      anomaly_detector: 0.3
      ml_classifier: 0.5
      rule_engine: 0.2
  
  # Performance monitoring
  monitoring:
    latency_threshold_ms: 100
    accuracy_window: 1000
    retrain_threshold: 0.1

# Demo 3: Sales Forecasting Configuration
sales_forecasting:
  model_class: "HybridForecastingModel"
  parameters:
    trend_model: "prophet"
    ml_model: "lightgbm"
    forecast_horizon: 12
    seasonal_periods: ["yearly", "monthly"]
    external_regressors: ["holidays", "promotions", "weather"]
    confidence_intervals: true
    ensemble_strategy: "horizon_weighted"
  
  # Prophet configuration
  prophet:
    yearly_seasonality: true
    weekly_seasonality: true
    daily_seasonality: false
    seasonality_mode: "multiplicative"
    seasonality_prior_scale: 10.0
    changepoint_prior_scale: 0.05
    interval_width: 0.95
    
    # Custom seasonalities
    custom_seasonalities:
      - name: "monthly"
        period: 30.5
        fourier_order: 5
      - name: "quarterly"
        period: 91.25
        fourier_order: 3
  
  # LightGBM configuration
  lightgbm:
    objective: "regression"
    metric: "rmse"
    boosting_type: "gbdt"
    num_leaves: 31
    learning_rate: 0.1
    feature_fraction: 0.9
    bagging_fraction: 0.8
    bagging_freq: 5
    n_estimators: 100
    random_state: 42
    verbose: -1
  
  # Feature engineering for ML component
  feature_engineering:
    date_features:
      - "year"
      - "month"
      - "quarter"
      - "day_of_week"
      - "day_of_year"
      - "week_of_year"
    
    lag_features:
      periods: [1, 2, 3, 6, 12]
      
    rolling_features:
      windows: [3, 6, 12]
      functions: ["mean", "std", "min", "max"]
    
    seasonal_indicators:
      - "is_holiday"
      - "is_promotion_period"
      - "season"
  
  # Ensemble weighting by forecast horizon
  ensemble_weights:
    short_term:  # 1-3 months
      prophet: 0.3
      lightgbm: 0.7
    medium_term:  # 4-9 months
      prophet: 0.5
      lightgbm: 0.5
    long_term:  # 10-12 months
      prophet: 0.7
      lightgbm: 0.3

# Global configuration settings
global:
  # Logging configuration
  logging:
    level: "INFO"
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    file: "integratedml_demos.log"
  
  # Performance settings
  performance:
    n_jobs: -1  # Use all available cores
    memory_limit: "4GB"
    timeout_seconds: 300
  
  # Data settings
  data:
    validation_split: 0.2
    test_split: 0.1
    random_state: 42
    missing_value_strategy: "median"  # or "mean", "mode", "drop"
  
  # Model persistence
  persistence:
    model_directory: "./models"
    backup_directory: "./models/backup"
    compression: true
    versioning: true

# Environment-specific configurations
environments:
  development:
    logging:
      level: "DEBUG"
    performance:
      timeout_seconds: 60
    data:
      sample_size: 1000  # Use smaller datasets for faster development
  
  testing:
    logging:
      level: "WARNING"
    data:
      sample_size: 100
      synthetic_data: true
  
  production:
    logging:
      level: "ERROR"
    performance:
      memory_limit: "16GB"
      timeout_seconds: 600
    persistence:
      backup_frequency: "daily"
      retention_days: 30