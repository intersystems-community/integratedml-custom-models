name: "CodeQL Security Analysis"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run weekly on Sundays at 3 AM UTC
    - cron: '0 3 * * 0'

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python', 'javascript' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby', 'swift' ]
        # Use only 'java' to analyze code written in Java, Kotlin or both
        # Use only 'javascript' to analyze code written in JavaScript, TypeScript or both
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python (for Python analysis)
      if: matrix.language == 'python'
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Python dependencies (for Python analysis)
      if: matrix.language == 'python'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Install the package in development mode for better analysis
        pip install -e .

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: ${{ matrix.language }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        
        # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        queries: +security-extended,security-and-quality
        
        # Additional packs for ML/data science security
        packs: |
          codeql/python-queries:AlertSuppression.ql
          codeql/python-queries:Security/CWE-079/XSS.ql
          codeql/python-queries:Security/CWE-089/SqlInjection.ql
          codeql/python-queries:Security/CWE-094/CodeInjection.ql

    # Autobuild attempts to build any compiled languages (C/C++, C#, Go, Java, or Swift).
    # If this step fails, then you should remove it and run the build manually (see below)
    - name: Autobuild
      uses: github/codeql-action/autobuild@v2

    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun

    #   If the Autobuild fails above, remove it and uncomment the following three lines.
    #   modify them (or add more) to build your code if your project, please refer to the EXAMPLE below for guidance.

    # - run: |
    #     echo "Run, Build Application using script"
    #     ./location_of_script_within_repo/buildscript.sh

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2
      with:
        category: "/language:${{matrix.language}}"
        # Upload results to Security tab
        upload: true
        # Wait for processing to complete
        wait-for-processing: true

    # Additional security analysis for ML frameworks
    - name: ML Security Analysis (Python only)
      if: matrix.language == 'python'
      run: |
        echo "Running additional ML security checks..."
        
        # Check for potential pickle security issues
        echo "Checking for unsafe pickle usage..."
        grep -r "pickle.load\|pickle.loads\|cPickle.load\|cPickle.loads" . --include="*.py" || echo "No unsafe pickle usage found"
        
        # Check for potential eval/exec usage
        echo "Checking for eval/exec usage..."
        grep -r "\beval\(\|\bexec\(" . --include="*.py" || echo "No eval/exec usage found"
        
        # Check for potential SQL injection in database modules
        echo "Checking database modules for SQL injection risks..."
        find shared/database demos/*/sql -name "*.py" -exec grep -l "format\|%" {} \; || echo "No potential SQL injection patterns found"
        
        # Check for hardcoded secrets
        echo "Checking for potential hardcoded secrets..."
        grep -r -i "password\s*=\s*['\"][^'\"]\|api_key\s*=\s*['\"][^'\"]\|secret\s*=\s*['\"][^'\"]\|token\s*=\s*['\"][^'\"]\|key\s*=\s*['\"][^'\"]" . --include="*.py" --exclude-dir=tests || echo "No hardcoded secrets found"

    # Generate security report
    - name: Generate Security Summary
      if: matrix.language == 'python'
      run: |
        echo "## 🔒 Security Analysis Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### CodeQL Analysis Completed" >> $GITHUB_STEP_SUMMARY
        echo "- **Language**: ${{ matrix.language }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Query Packs**: security-extended, security-and-quality" >> $GITHUB_STEP_SUMMARY
        echo "- **Focus Areas**: SQL injection, XSS, code injection, ML security patterns" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Key Security Considerations for IntegratedML Framework" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ **Model Serialization**: Validate pickle usage for model persistence" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ **Database Security**: Check parameterized queries in IRIS integration" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ **Input Validation**: Ensure user inputs are properly sanitized" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ **Configuration Security**: No hardcoded credentials or API keys" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "- Review any CodeQL alerts in the Security tab" >> $GITHUB_STEP_SUMMARY
        echo "- Address high/critical severity findings promptly" >> $GITHUB_STEP_SUMMARY
        echo "- Consider implementing additional security controls for production deployments" >> $GITHUB_STEP_SUMMARY

  # Additional security scanning for dependencies
  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install safety pip-audit bandit
    
    - name: Run safety check for known vulnerabilities
      run: |
        echo "Running safety check for known vulnerabilities..."
        safety check --json --output safety-results.json || true
        safety check --short-report
    
    - name: Run pip-audit for additional vulnerability scanning
      run: |
        echo "Running pip-audit for comprehensive vulnerability scanning..."
        pip-audit --format=json --output=pip-audit-results.json || true
        pip-audit --desc
    
    - name: Upload dependency security results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: dependency-security-results
        path: |
          safety-results.json
          pip-audit-results.json
        retention-days: 30

  # SARIF upload for additional tools
  sarif-upload:
    name: Upload SARIF Results
    runs-on: ubuntu-latest
    needs: [analyze]
    if: always()
    permissions:
      security-events: write
    
    steps:
    - name: Download analysis results
      uses: actions/download-artifact@v3
      with:
        name: dependency-security-results
        path: ./security-results
      continue-on-error: true
    
    - name: Upload additional SARIF results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: ./security-results/
        category: "dependency-check"
      continue-on-error: true

  # Security summary job
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [analyze, dependency-check]
    if: always()
    
    steps:
    - name: Security Analysis Summary
      run: |
        echo "## 🛡️ IntegratedML Security Analysis Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Analysis Results" >> $GITHUB_STEP_SUMMARY
        echo "- **CodeQL Analysis**: ${{ needs.analyze.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Dependency Check**: ${{ needs.dependency-check.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Security Focus Areas for IntegratedML" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### 🏗️ **Framework Security**" >> $GITHUB_STEP_SUMMARY
        echo "- Model serialization and deserialization safety" >> $GITHUB_STEP_SUMMARY
        echo "- Database integration and SQL injection prevention" >> $GITHUB_STEP_SUMMARY
        echo "- Configuration management and secrets handling" >> $GITHUB_STEP_SUMMARY
        echo "- Input validation and sanitization" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### 🔬 **ML-Specific Security**" >> $GITHUB_STEP_SUMMARY
        echo "- Safe model loading (pickle alternatives recommended)" >> $GITHUB_STEP_SUMMARY
        echo "- Feature engineering input validation" >> $GITHUB_STEP_SUMMARY
        echo "- Model prediction result sanitization" >> $GITHUB_STEP_SUMMARY
        echo "- Ensemble model component isolation" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### 🏢 **Enterprise Considerations**" >> $GITHUB_STEP_SUMMARY
        echo "- IRIS database connection security" >> $GITHUB_STEP_SUMMARY
        echo "- Docker container security hardening" >> $GITHUB_STEP_SUMMARY
        echo "- Production deployment security controls" >> $GITHUB_STEP_SUMMARY
        echo "- Audit logging and monitoring" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 Action Items" >> $GITHUB_STEP_SUMMARY
        echo "1. Review CodeQL findings in the [Security tab](../security)" >> $GITHUB_STEP_SUMMARY
        echo "2. Address any high/critical severity vulnerabilities" >> $GITHUB_STEP_SUMMARY
        echo "3. Implement additional security controls for production use" >> $GITHUB_STEP_SUMMARY
        echo "4. Regular dependency updates via Dependabot" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "*Security analysis completed on $(date)*" >> $GITHUB_STEP_SUMMARY