[tool:pytest]
# Pytest configuration for fraud detection tests

# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interaction
    performance: Performance and latency tests
    slow: Slow running tests
    requires_data: Tests that require large datasets

# Output options
addopts = 
    --strict-markers
    --strict-config
    --tb=short
    --durations=10
    --color=yes

# Minimum version
minversion = 6

# Filter warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Test timeout (in seconds)
timeout = 300

# Coverage options (if pytest-cov is installed)
[coverage:run]
source = demos/fraud_detection
omit = 
    */tests/*
    */test_*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError