# DNA Class Mapping (for reference)
class_mapping:
  0: "G protein coupled receptors"
  1: "tyrosine kinase"
  2: "tyrosine phosphatase" 
  3: "synthetase"
  4: "synthase"
  5: "ion channel"
  6: "transcription factor"

# Sample Data for Testing
sample_sequences:
  - sequence: "ATGAACTGTCCAGCCCCTGTGGAGATCTCCTATGAGAACATGCGTTTTCTGATATCTCACAACCCT"
    expected_class: "tyrosine phosphatase"
  - sequence: "ATGGCGCTGAACCCTTCCGGCACCATGGCCAAGTCCTACTTCATCGAGAACGCC"
    expected_class: "transcription factor"
  - sequence: "ATGTCTAAAAAGGAGAAAGACAAACTCACTATTCAATCAATCGCAATCAGCTGC"
